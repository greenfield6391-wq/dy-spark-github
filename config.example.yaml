# ===== 抖音续火花 · 配置模板 =====
# 说明：第一次运行时程序会自动把这个文件复制成 config.yaml。
# 好友名单建议用「设置向导」勾选，不用手改这个文件。

# 每天几点发送（24 小时制，建议 20:00-22:00，太晚容易跨零点翻车）
send_time: "21:30"

# 实际执行时间会在 send_time 之后随机延后 0~N 分钟，避免天天同一秒（同一天内重试延迟不变）
jitter_minutes: 12

# 相邻两个好友之间停顿多少秒（随机取区间内的值），上限 15 秒
gap_seconds: [2, 15]

# 只在星期几发送：0=周一 … 6=周日。留空 [] 表示每天都发
weekdays: []

# 每个好友每天发几条（火花只要 1 条，多发给别人刷屏没必要）
messages_per_friend: 1

# 火花图标已经是彩色（=今天已续过，不管是谁续的）就跳过，防止重复发
skip_if_lit: true

# ===== 好友名单 =====
# 由设置向导写入；name 必须和抖音里显示的昵称（或备注）完全一致。
# group: normal=普通（默认，可不写）  close=铁哥们（用下面 close_messages 的话术）
# 手动加也可以，格式：
#   friends:
#     - name: "张三"
#     - name: "李四"
#       group: close
friends: []


# ===== 消息池 =====
# 每次随机挑一条，且尽量不和上一条重复。
# 事实教训：问句（在吗/吃啥了）会给对方回复压力，「你好」「晚安」也容易奇怪，
# 最稳的是明示来意的短句。
messages:
  - "续"
  - "火"
  - "续火"
  - "火火火"
  - "续续续"

# 熟人组（group: close）专用话术，只在设置页点过「熟」的人里轮换
close_messages:
  - "续命来了"
  - "火不能断，这是原则问题"
  - "今天你也没理我，行"
  - "来，喂一口火"
  - "兄弟，这火比我绩点稳"

# ===== 进阶 =====
# 浏览器是常驻的（跑完窗口留着，下次直接连，省启动时间）
# 想彻底关掉：直接手动关 Edge 窗口即可，下次运行会自动重新拉起（登录态不丢）

# 出问题时截图保存到 screenshots/ 目录
screenshot_on_error: true
